<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Electric - Categorías</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/clientes}">
                <span class="brand-icon"><i class="bi bi-lightning-charge-fill"></i></span>
                Ecommerce<span class="brand-text-highlight">Electric</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-3">
                    <li class="nav-item"><a class="nav-link" th:href="@{/clientes}"><i class="bi bi-people"></i> Clientes</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/categorias}"><i class="bi bi-tags"></i> Categorías</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/productos}"><i class="bi bi-box-seam"></i> Productos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/proveedores}"><i class="bi bi-truck"></i> Proveedores</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">Módulos</li>
                        <li class="breadcrumb-item active">Categorías</li>
                    </ol>
                </nav>
                <h3>Catálogo de Categorías</h3>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#categorias_modal_registro">
                <i class="bi bi-folder-plus"></i> Nueva Categoría
            </button>
        </div>

        <div class="card mb-4" id="categorias_seccion_busqueda">
            <div class="card-body">
                <!-- Conecta con la tabla categorias para buscar -->
                <form id="categorias_formulario_busqueda" th:action="@{/categorias}" method="get">
                    <div class="search-wrapper">
                        <i class="bi bi-search"></i>
                        <!-- Busca el ID en la base de datos -->
                        <input type="number" id="categorias_input_buscar_id" name="buscarId" th:value="${buscarId}" class="form-control" placeholder="Buscar por ID de categoría...">
                    </div>
                </form>
            </div>
        </div>

        <div class="card" id="categorias_seccion_tabla">
            <div class="card-header">
                <i class="bi bi-table text-primary me-2"></i> Registros Disponibles
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="categorias_tabla_listado">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>NOMBRE DE CATEGORÍA</th>
                            <th>DESCRIPCIÓN</th>
                            <th class="text-center">ESTADO</th>
                            <th class="text-center">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Muestra todos los registros de la tabla categorias -->
                        <tr th:each="cat : ${categorias}" th:id="'categorias_fila_' + ${cat.id}">
                            <!-- Imprime los datos de las columnas de la BD -->
                            <td th:text="${cat.id}"></td>
                            <td th:text="${cat.nombre}"></td>
                            <td th:text="${cat.descripcion}"></td>
                            <td class="text-center" th:text="${cat.estado != null ? cat.estado : 'ACTIVO'}"></td>
                            <td class="text-center">
                                <!-- Edita un registro en la tabla categorias -->
                                <a th:href="@{/categorias/editar/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-secondary border-0" title="Editar">
                                    <i class="bi bi-pencil-square text-warning"></i>
                                </a>
                                <!-- Elimina un registro en la tabla categorias -->
                                <a th:href="@{/categorias/eliminar/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-secondary border-0" title="Eliminar" onclick="return confirm('¿Eliminar categoría?')">
                                    <i class="bi bi-trash text-danger"></i>
                                </a>
                            </td>
                        </tr>

                        <!-- Mensaje si la tabla categorias está vacía -->
                        <tr th:if="${categorias == null or #lists.isEmpty(categorias)}">
                            <td colspan="5" class="text-center py-5">
                                <i class="bi bi-inbox empty-state-icon"></i>
                                <span class="text-muted">No se encontraron categorías registradas.</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="categorias_modal_registro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Registrar Categoría</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <!-- Inserta un nuevo registro en la tabla categorias -->
                <form id="categorias_formulario_registro" th:action="@{/categorias/guardar}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="categorias_input_nombre" class="form-label">Nombre de Categoría</label>
                            <!-- Guarda en la columna nombre de la BD -->
                            <input type="text" id="categorias_input_nombre" name="nombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="categorias_textarea_descripcion" class="form-label">Descripción</label>
                            <!-- Guarda en la columna descripcion de la BD -->
                            <textarea id="categorias_textarea_descripcion" name="descripcion" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="categorias_select_estado" class="form-label">Estado</label>
                            <!-- Guarda en la columna estado de la BD -->
                            <select id="categorias_select_estado" name="estado" class="form-select">
                                <option value="ACTIVO">Activo</option>
                                <option value="INACTIVO">Inactivo</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="categorias_btn_guardar" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
