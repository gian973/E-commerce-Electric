<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Electric - Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/Cliente}">
                <span class="brand-icon"><i class="bi bi-lightning-charge-fill"></i></span>
                Ecommerce<span class="brand-text-highlight">Electric</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-3">
                    <li class="nav-item"><a class="nav-link" th:href="@{/Cliente}"><i class="bi bi-people"></i> Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/categorias}"><i class="bi bi-tags"></i> Categorías</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/productos}"><i class="bi bi-box-seam"></i> Productos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/proveedores}"><i class="bi bi-truck"></i> Proveedores</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">Módulos</li>
                        <li class="breadcrumb-item active">Productos</li>
                    </ol>
                </nav>
                <h3>Catálogo de Productos</h3>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productos_modal_registro">
                <i class="bi bi-plus-circle"></i> Nuevo Producto
            </button>
        </div>

        <div class="card mb-4" id="productos_seccion_busqueda">
            <div class="card-body">
                <!-- Conecta con la tabla productos para buscar -->
                <form id="productos_formulario_busqueda" th:action="@{/productos}" method="get">
                    <div class="search-wrapper">
                        <i class="bi bi-search"></i>
                        <!-- Busca el ID en la base de datos -->
                        <input type="number" id="productos_input_buscar_id" name="buscarId" th:value="${buscarId}" class="form-control" placeholder="Buscar por ID de producto...">
                    </div>
                </form>
            </div>
        </div>

        <div class="card" id="productos_seccion_tabla">
            <div class="card-header">
                <i class="bi bi-table text-primary me-2"></i> Registros Disponibles
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="productos_tabla_listado">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>NOMBRE DEL PRODUCTO</th>
                            <th>PRECIO (S/)</th>
                            <th>CÓDIGO SKU</th>
                            <th class="text-center">ESTADO</th>
                            <th class="text-center">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Muestra todos los registros de la tabla productos -->
                        <tr th:each="p : ${productos}" th:id="'productos_fila_' + ${p.id}">
                            <!-- Imprime los datos de las columnas de la BD -->
                            <td th:text="${p.id}"></td>
                            <td th:text="${p.nombre}"></td>
                            <td th:text="${p.precio}"></td>
                            <td th:text="${p.codigoSku}"></td>
                            <td class="text-center" th:text="${p.active ? 'ACTIVO' : 'INACTIVO'}"></td>
                            <td class="text-center">
                                <!-- Edita un registro en la tabla productos -->
                                <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-secondary border-0" title="Editar">
                                    <i class="bi bi-pencil-square text-warning"></i>
                                </a>
                                <!-- Elimina un registro en la tabla productos -->
                                <form th:action="@{/productos/eliminar/{id}(id=${p.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar producto?')">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary border-0" title="Eliminar">
                                        <i class="bi bi-trash text-danger"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <!-- Mensaje si la tabla productos está vacía -->
                        <tr th:if="${productos == null or #lists.isEmpty(productos)}">
                            <td colspan="6" class="text-center py-5">
                                <i class="bi bi-inbox empty-state-icon"></i>
                                <span class="text-muted">No se encontraron productos registrados.</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="productos_modal_registro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Registrar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <!-- Inserta un nuevo registro en la tabla productos -->
                <form id="productos_formulario_registro" th:action="@{/productos/guardar}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="productos_input_nombre" class="form-label">Nombre del Producto</label>
                            <!-- Guarda en la columna nombre de la BD -->
                            <input type="text" id="productos_input_nombre" name="nombre" maxlength="40" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="productos_textarea_descripcion" class="form-label">Descripción</label>
                            <textarea id="productos_textarea_descripcion" name="descripcion" maxlength="200" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="productos_input_sku" class="form-label">Código SKU</label>
                            <input type="text" id="productos_input_sku" name="codigoSku" maxlength="20" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="productos_input_precio" class="form-label">Precio (S/)</label>
                                <!-- Guarda en la columna precio de la BD -->
                                <input type="number" min="0" step="0.01" id="productos_input_precio" name="precio" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="productos_input_imagen" class="form-label">URL de imagen</label>
                            <input type="url" id="productos_input_imagen" name="imagenUrl" class="form-control" required>
                        </div>
                        <div class="form-check mb-3">
                            <input type="checkbox" id="productos_select_estado" name="active" value="true" class="form-check-input" checked>
                            <label for="productos_select_estado" class="form-check-label">Activo</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="productos_btn_guardar" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
