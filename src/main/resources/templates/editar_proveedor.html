<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5">
        <h1 class="h3 mb-4">Editar proveedor</h1>
        <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post" class="card card-body">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label for="razonSocial" class="form-label">Razón social</label>
                <input id="razonSocial" type="text" th:field="*{razon_social}" maxlength="200" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="ruc" class="form-label">RUC</label>
                <input id="ruc" type="text" th:field="*{ruc}" maxlength="40" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="nombreContacto" class="form-label">Nombre de contacto</label>
                <input id="nombreContacto" type="text" th:field="*{nombre_contacto}" maxlength="30" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo</label>
                <input id="correo" type="email" th:field="*{correo}" maxlength="30" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input id="telefono" type="tel" th:field="*{telefono}" maxlength="30" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input id="direccion" type="text" th:field="*{direccion}" maxlength="30" class="form-control" required>
            </div>
            <div class="form-check mb-3">
                <input id="activo" type="checkbox" th:field="*{activo}" class="form-check-input">
                <label for="activo" class="form-check-label">Activo</label>
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a th:href="@{/proveedores}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
