<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5">
        <h1 class="h3 mb-4">Editar producto</h1>
        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="card card-body">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" maxlength="40" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" maxlength="200" class="form-control" required></textarea>
            </div>
            <div class="mb-3">
                <label for="codigoSku" class="form-label">Código SKU</label>
                <input id="codigoSku" type="text" th:field="*{codigoSku}" maxlength="20" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="precio" class="form-label">Precio (S/)</label>
                <input id="precio" type="number" th:field="*{precio}" min="0" step="0.01" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="imagenUrl" class="form-label">URL de imagen</label>
                <input id="imagenUrl" type="url" th:field="*{imagenUrl}" class="form-control" required>
            </div>
            <div class="form-check mb-3">
                <input id="active" type="checkbox" th:field="*{active}" class="form-check-input">
                <label for="active" class="form-check-label">Activo</label>
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
