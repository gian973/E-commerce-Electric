<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Electric - Proveedores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/clientes}">
                <span class="brand-icon"><i class="bi bi-lightning-charge-fill"></i></span>
                Ecommerce<span class="brand-text-highlight">Electric</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-3">
                    <li class="nav-item"><a class="nav-link" th:href="@{/clientes}"><i class="bi bi-people"></i> Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/categorias}"><i class="bi bi-tags"></i> Categorías</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/productos}"><i class="bi bi-box-seam"></i> Productos</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/proveedores}"><i class="bi bi-truck"></i> Proveedores</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">Módulos</li>
                        <li class="breadcrumb-item active">Proveedores</li>
                    </ol>
                </nav>
                <h3>Directorio de Proveedores</h3>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#proveedores_modal_registro">
                <i class="bi bi-plus-circle"></i> Nuevo Proveedor
            </button>
        </div>

        <div class="card mb-4" id="proveedores_seccion_busqueda">
            <div class="card-body">
                <!-- Conecta con la tabla proveedores para buscar -->
                <form id="proveedores_formulario_busqueda" th:action="@{/proveedores}" method="get">
                    <div class="search-wrapper">
                        <i class="bi bi-search"></i>
                        <!-- Busca el ID en la base de datos -->
                        <input type="number" id="proveedores_input_buscar_id" name="buscarId" th:value="${buscarId}" class="form-control" placeholder="Buscar por ID de proveedor...">
                    </div>
                </form>
            </div>
        </div>

        <div class="card" id="proveedores_seccion_tabla">
            <div class="card-header">
                <i class="bi bi-table text-primary me-2"></i> Registros Disponibles
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="proveedores_tabla_listado">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>RAZÓN SOCIAL</th>
                            <th>RUC</th>
                            <th>CORREO</th>
                            <th>TELÉFONO</th>
                            <th class="text-center">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Muestra todos los registros de la tabla proveedores -->
                        <tr th:each="pr : ${proveedores}" th:id="'proveedores_fila_' + ${pr.id}">
                            <!-- Imprime los datos de las columnas de la BD -->
                            <td th:text="${pr.id}"></td>
                            <td th:text="${pr.nombre}"></td>
                            <td th:text="${pr.ruc}"></td>
                            <td th:text="${pr.email}"></td>
                            <td th:text="${pr.telefono}"></td>
                            <td class="text-center">
                                <!-- Edita un registro en la tabla proveedores -->
                                <a th:href="@{/proveedores/editar/{id}(id=${pr.id})}" class="btn btn-sm btn-outline-secondary border-0" title="Editar">
                                    <i class="bi bi-pencil-square text-warning"></i>
                                </a>
                                <!-- Elimina un registro en la tabla proveedores -->
                                <a th:href="@{/proveedores/eliminar/{id}(id=${pr.id})}" class="btn btn-sm btn-outline-secondary border-0" title="Eliminar" onclick="return confirm('¿Eliminar proveedor?')">
                                    <i class="bi bi-trash text-danger"></i>
                                </a>
                            </td>
                        </tr>

                        <!-- Mensaje si la tabla proveedores está vacía -->
                        <tr th:if="${proveedores == null or #lists.isEmpty(proveedores)}">
                            <td colspan="6" class="text-center py-5">
                                <i class="bi bi-inbox empty-state-icon"></i>
                                <span class="text-muted">No se encontraron proveedores registrados.</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="proveedores_modal_registro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Registrar Proveedor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <!-- Inserta un nuevo registro en la tabla proveedores -->
                <form id="proveedores_formulario_registro" th:action="@{/proveedores/guardar}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="proveedores_input_nombre" class="form-label">Razón Social</label>
                            <!-- Guarda en la columna nombre de la BD -->
                            <input type="text" id="proveedores_input_nombre" name="nombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="proveedores_input_ruc" class="form-label">RUC</label>
                            <!-- Guarda en la columna ruc de la BD -->
                            <input type="text" id="proveedores_input_ruc" name="ruc" class="form-control" maxlength="11" required>
                        </div>
                        <div class="mb-3">
                            <label for="proveedores_input_email" class="form-label">Correo</label>
                            <!-- Guarda en la columna email de la BD -->
                            <input type="email" id="proveedores_input_email" name="email" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="proveedores_input_telefono" class="form-label">Teléfono</label>
                            <!-- Guarda en la columna telefono de la BD -->
                            <input type="text" id="proveedores_input_telefono" name="telefono" class="form-control">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="proveedores_btn_guardar" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
