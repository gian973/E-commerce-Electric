spring.application.name=ecomerceelectric

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerceelectric?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Crear y actualizar las tablas durante el desarrollo
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
